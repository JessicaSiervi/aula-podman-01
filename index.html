
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Minha Lista de Tarefas</h1>
        <p>Organize seu dia e alcance seus objetivos!</p>
    </header>

    <main class="container">

        <section class="card">
            <h2>Adicionar tarefa</h2>

            <form>
                <input type="text" placeholder="Digite uma tarefa...">
                <button type="button">Adicionar</button>
            </form>
        </section>

        <section class="card">
            <h2>Minhas tarefas</h2>

            <ul>
                <li>
                    <span>Estudar HTML</span>
                    <span class="status">Pendente</span>
                </li>

                <li>
                    <span>Praticar CSS</span>
                    <span class="status">Pendente</span>
                </li>

                <li>
                    <span>Fazer atividade da escola</span>
                    <span class="status concluida">Concluída</span>
                </li>
            </ul>
        </section>

    </main>

    <footer>
        <p>Desenvolvido por mim | 2026</p>
    </footer>

</body>
</html>
